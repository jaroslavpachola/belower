# @generated by autocargo from //resctl/below:below

[package]
name = "belower"
version = "0.11.0"
authors = ["Meta Platforms, Inc. and affiliates", "Jaroslav Pachola"]
edition = "2024"
description = "An interactive tool to view and record historical system data"
readme = "../README.md"
repository = "https://github.com/jaroslavpachola/belower"
license = "Apache-2.0"

[package.metadata]

[package.metadata.deb]

[package.metadata.deb.systemd-units]
unit-name = "belower"
unit-scripts = "../etc"

[dependencies]
anyhow = "1.0.104"
aya = { version = "0.14.0", default-features = false }
below-exitstat-common = { version = "0.11.0", path = "exitstat-common", features = ["user"] }
cgroupfs = { version = "0.11.0", path = "cgroupfs" }
clap = { version = "4.6.2", features = ["derive", "env", "string", "unicode", "wrap_help"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
common = { package = "below-common", version = "0.11.0", path = "common" }
config = { package = "below-config", version = "0.11.0", path = "config" }
cursive = { version = "0.21.1", features = ["crossterm-backend"], default-features = false }
dump = { package = "below-dump", version = "0.11.0", path = "dump" }
indicatif = { version = "0.18.6", features = ["futures", "improved_unicode", "rayon", "tokio"] }
libc = "0.2.186"
model = { package = "below-model", version = "0.11.0", path = "model" }
nix = { version = "0.31.3", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }
procfs = { package = "fb_procfs", version = "0.11.0", path = "procfs" }
regex = "1.13.1"
scopeguard = "1.2.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
signal-hook = "0.3.18"
slog = { version = "2.8.2", features = ["max_level_trace", "nested-values"] }
slog-term = "2.9.2"
store = { package = "below-store", version = "0.11.0", path = "store" }
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full", "test-util", "tracing"] }
view = { package = "below-view", version = "0.11.0", path = "view" }

[dev-dependencies]
maplit = "1.0"
portpicker = "0.1.1"

[features]
default = []
# Read cgroup stats with a BPF iterator when enable_cgroup_bpf is set. Builds
# libbpf and the BPF program from C, so it needs clang, libelf and zlib.
cgroup-bpf = ["cgroupfs/cgroup-bpf"]
enable_backtrace = []
no-vendor = ["store/no-vendor"]
