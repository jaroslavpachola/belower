name: Release

# Pushing a v* tag builds belower for x86_64 and aarch64 and publishes a
# GitHub release with the binaries. Running the workflow by hand builds the
# binaries (as workflow artifacts) without releasing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    # The same build as CI: a release binary for glibc 2.34 and later.
    - name: Build
      run: docker build --target builder -t belower .
    - name: Package
      run: |
        name="belower-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux-gnu"
        mkdir "$name"
        id=$(docker create belower)
        docker cp "$id:/usr/local/bin/belower" "$name/belower"
        docker rm "$id"
        cp README.md LICENSE NOTICE "$name/"
        tar -czf "$name.tar.gz" "$name"
        sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
    - uses: actions/upload-artifact@v7
      with:
        name: belower-${{ matrix.arch }}
        path: belower-*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v8
      with:
        merge-multiple: true
    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh release create "$GITHUB_REF_NAME"
        --repo "$GITHUB_REPOSITORY"
        --title "belower $GITHUB_REF_NAME"
        --generate-notes
        belower-*.tar.gz belower-*.tar.gz.sha256
